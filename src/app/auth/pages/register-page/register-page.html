<div class="h-dvh w-full flex bg-[#0F172A]">
    <div class="grid grid-cols-1 md:grid-cols-2 w-full h-full">
        
        <div class="hidden md:block relative w-full h-full overflow-hidden">
            <div class="absolute inset-0 bg-black/20 z-10"></div>
            
            <div *ngFor="let img of images; let i = index" 
                 class="absolute inset-0 w-full h-full bg-cover bg-center opacity-0 animate-slideshow"
                 [style.backgroundImage]="'url(' + img + ')'"
                 [style.animationDelay]="(i * 5) + 's'">
            </div>
        </div>

        <div class="flex items-center justify-center w-full p-8">
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" 
                  class="p-8 bg-[#0F172A] shadow-2xl w-full max-w-md border border-white/20 rounded-2xl">
                
                <div class="flex flex-col gap-4 w-full">
                    <p class="text-center tracking-widest text-4xl text-white font-bold mb-2">Register</p>
                    
                    <div class="flex flex-col gap-1">
                        <input 
                            type="email" 
                            formControlName="email" 
                            placeholder="Email" 
                            class="input w-full bg-[#1E293B] border border-white/10 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg p-3 transition-all" 
                        />
                    </div>

                    <div class="flex flex-col gap-1">
                        <input 
                            type="password" 
                            formControlName="password" 
                            placeholder="Password" 
                            class="input w-full bg-[#1E293B] border border-white/10 text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg p-3 transition-all" 
                        />
                    </div>

                    <button class="btn btn-neutral mt-4 bg-white text-[#0F172A] hover:bg-gray-200 font-bold py-3 rounded-lg transition-all active:scale-95 border-none">
                        Registrar
                    </button>

                    <p class="text-center text-sm text-gray-400 mt-2">
                        ¿Ya tienes cuenta? 
                        <a routerLink="/login" class="text-white hover:underline font-semibold">Inicia sesión</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
